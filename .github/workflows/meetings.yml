name: Meeting schedule
on:
  schedule:
    - cron: "17 3 * * 1,4" # Mondays and Thursdays, early morning UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/meetings.py app/meetings.json
      - name: Commit if changed
        run: |
          git config user.name "psalmist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/meetings.json
          git diff --cached --quiet || (git commit -m "Update meeting schedule" && git push)
